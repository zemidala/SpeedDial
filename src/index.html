<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Добавлено для лучшей совместимости с Edge -->
  <title>SimpleSpeedDial - New Tab</title> <!-- Более описательный title -->

  <!-- Preload важных ресурсов -->
  <link rel="preload" href="css/styles.css" as="style">
  <link rel="preload" href="js/bookmarks.js" as="script">
  <link rel="preload" href="js/main.js" as="script">
  <link rel="stylesheet" href="css/settings-panel.css">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon для случаев, если страница открыта вне расширения -->
  <link rel="icon" href="../icons/icon48.png" type="image/png">
</head>

<body>
<!-- Панель настроек -->
<button id="toggleSettings" class="settings-toggle">⚙️</button>
<div class="settings-panel" id="settingsPanel">
  <h2>Settings</h2>
  <label for="tileSize">Tile Size:</label>
  <input type="range" id="tileSize" min="50" max="300" value="120">
  <span id="tileSizeValue">120px</span> <!-- Отображение текущего значения -->

  <label for="tileColor">Tile Color:</label>
  <input type="color" id="tileColor" value="#ffffff">

  <label for="folderColor">Folder Color:</label>
  <input type="color" id="folderColor" value="#e6f2ff">

  <label for="fontFamily">Font Family:</label>
  <input type="text" id="fontFamily" value="Segoe UI, system-ui, sans-serif">

  <button id="saveSettings">Save Settings</button>
</div>

<!-- Добавлен ARIA-атрибуты для доступности -->
<div class="container" role="main">
  <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb navigation">
    <a href="#" class="breadcrumb-home" aria-current="page">Home</a>
  </nav>

  <section class="section_bookmarks" id="section_bookmarks" aria-live="polite">
    <!-- Bookmarks and folders will be rendered here -->
  </section>
</div>

<!-- Скрипты в конце body с атрибутами defer -->
<script src="js/bookmarks.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/settings.js"></script>

<!-- Fallback для случаев, если JavaScript отключен -->
<noscript>
  <div class="noscript-warning">
    <p>Please enable JavaScript to use SimpleSpeedDial extension.</p>
  </div>
</noscript>
</body>
</html>
