# A pushed version tag (v2.0.0) becomes a GitHub release: checked, built and packed as in `npm run package`,
# with the notes from docs/releases/<tag>.md and the zip attached
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count: the whole history is needed
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # The tag must name the version in the manifest: v2.0.0 ↔ "version": "2.0.0"
      - name: Check the tag against the manifest
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the manifest version $version"
            exit 1
          fi

      - run: npm run package

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "No release notes: $notes"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "SpeedDial ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
